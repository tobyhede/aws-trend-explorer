<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 680" role="img" aria-labelledby="title desc"><title id="title">AWS product-change announcements: matched 2025 and 2026 periods</title><desc id="desc">Counts by reviewed product-change level for January 1 through October 28 of each year. Excluded announcements shown in footer.</desc><rect width="1050" height="680" fill="#f5f5ef"/><g font-family="Arial,sans-serif" fill="#203a3d"><text x="35" y="45" font-size="27">Scope of the AWS product change</text><text x="35" y="76" font-size="16">January 1–October 28 in each year · source-reviewed announcement counts</text><rect x="725" y="96" width="15" height="15" fill="#789797"/><text x="747" y="109" font-size="15">2025</text><rect x="825" y="96" width="15" height="15" fill="#086c67"/><text x="847" y="109" font-size="15">2026</text><text x="35" y="172" font-size="16">Parameter change</text><rect x="280" y="150" width="135.56" height="19" fill="#789797"/><text x="425.56" y="165" font-size="14">222</text><rect x="280" y="176" width="190.51" height="19" fill="#086c67"/><text x="480.51" y="191" font-size="14">312</text><text x="35" y="245" font-size="16">Capability refinement</text><rect x="280" y="223" width="534.28" height="19" fill="#789797"/><text x="824.28" y="238" font-size="14">875</text><rect x="280" y="249" width="610.00" height="19" fill="#086c67"/><text x="900.00" y="264" font-size="14">999</text><text x="35" y="318" font-size="16">New capability</text><rect x="280" y="296" width="174.63" height="19" fill="#789797"/><text x="464.63" y="311" font-size="14">286</text><rect x="280" y="322" width="234.47" height="19" fill="#086c67"/><text x="524.47" y="337" font-size="14">384</text><text x="35" y="391" font-size="16">Major product expansion</text><rect x="280" y="369" width="13.43" height="19" fill="#789797"/><text x="303.43" y="384" font-size="14">22</text><rect x="280" y="395" width="18.32" height="19" fill="#086c67"/><text x="308.32" y="410" font-size="14">30</text><text x="35" y="464" font-size="16">New product</text><rect x="280" y="442" width="1.22" height="19" fill="#789797"/><text x="291.22" y="457" font-size="14">2</text><rect x="280" y="468" width="5.50" height="19" fill="#086c67"/><text x="295.50" y="483" font-size="14">9</text><text x="35" y="537" font-size="16">Needs review</text><rect x="280" y="515" width="6.11" height="19" fill="#789797"/><text x="296.11" y="530" font-size="14">10</text><rect x="280" y="541" width="6.72" height="19" fill="#086c67"/><text x="296.72" y="556" font-size="14">11</text><text x="35" y="607" font-size="15">Outside scale — 2025: 601 · 2026: 512</text><text x="35" y="634" font-size="14">AI source judgments; see review.html for the independent sample and limitations.</text><text x="35" y="658" font-size="14">Levels describe announced changes, not engineering effort or customer impact.</text></g></svg>